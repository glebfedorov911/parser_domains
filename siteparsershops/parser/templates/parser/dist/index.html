{% extends "parser/base.html" %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        {{form_date.as_p}}
        <button type="submit">Ввести дату</button>
    </form>
    <h1>Дата: {{date.date}}</h1>
    <form method="post", enctype="multipart/form-data">
        {% csrf_token %}
        {{form_file.as_p}}
        <button type="submit">Загрузить файл</button>
    </form>

    <form action="{% url 'parser' %}" id="startparser" method="get">
        {% csrf_token %}
        <input type="hidden" name="start" id="start-param">
        <button type="submit" onclick="setStartParam()">Запустить парсер</button>
    </form>

    <!-- <form action="", onsubmit="sendMessage(event)">
        {% csrf_token %}
        <input type="text" id="msg">
        <button type="submit">отправить</button>
    </form> -->

    <div id="forws"></div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws/parser/`);

        ws.onmessage = function(event) {
            let data = JSON.parse(event.data)
            document.querySelector("#forws").innerHTML = data.msg;
        }
        
        function setStartParam() {
            document.getElementById("start-param").value = "True";
        }

        // ws.onmessage = function(event) {
        //     let form = document.querySelector("#forws")
        //     form.innerHTML = event.data
        // }
        // function sendMessage(event) {
        //     let input = document.querySelector("#msg")
        //     data = input.value
        //     ws.send(JSON.stringify({"msg": data}))
        //     input.value = ""
        //     event.preventDefault()
        // }
    </script>

{% endblock %}
